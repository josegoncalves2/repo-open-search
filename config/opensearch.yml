# ---------------------------------------------------------------------------
# opensearch.yml - configuracao principal do no OpenSearch
# Montado em /usr/share/opensearch/config/opensearch.yml via docker-compose
# Habilita todos os plugins oficiais necessarios para AI/Agentic/LLM
# ---------------------------------------------------------------------------

cluster.name: opensearch-cluster
node.name: opensearch-node1
discovery.type: single-node
bootstrap.memory_lock: true
network.host: 0.0.0.0

# ----------------------- Plugin de seguranca (ativo) -----------------------
plugins.security.ssl.http.enabled: true
plugins.security.ssl.transport.enabled: true
plugins.security.ssl.http.pemcert_filepath: esnode.pem
plugins.security.ssl.http.pemkey_filepath: esnode-key.pem
plugins.security.ssl.transport.pemcert_filepath: esnode.pem
plugins.security.ssl.transport.pemkey_filepath: esnode-key.pem
plugins.security.ssl.transport.pemtrustedcas_filepath: root-ca.pem
plugins.security.ssl.http.pemtrustedcas_filepath: root-ca.pem
plugins.security.authcz.admin_dn:
  - CN=admin,OU=SSL,O=Test,L=Test,C=DE
plugins.security.nodes_dn:
  - CN=opensearch-node1,OU=SSL,O=Test,L=Test,C=DE

# ----------------------- Plugins oficiais (todos ativos) -------------------
plugins.alerting.enabled: true
plugins.anomaly_detection.enabled: true
plugins.index_management.enabled: true
plugins.notifications.enabled: true
plugins.notifications.core.enabled: true
plugins.security_analytics.enabled: true
plugins.observability.enabled: true
plugins.query.workbench.enabled: true
plugins.ml_commons.enabled: true
plugins.ml_commons.agent_framework.enabled: true
plugins.ml_commons.rag_pipeline_feature_enabled: true
plugins.knn.enabled: true

# Permite que o agent framework registre modelos remotos e locais
plugins.ml_commons.allow_registering_model_via_purl: true
plugins.ml_commons.allow_registering_model_via_url: true
plugins.ml_commons.native_memory_threshold: 80
plugins.ml_commons.job_manager.limit_enabled: true
plugins.ml_commons.job_manager.limit_max_models: 10

# Multi-tenancy no Dashboards (necessario para tenants Private/Global)
plugins.security.multitenancy.enabled: true
plugins.security.multitenancy.tenants.preferred: [Private, Global]

# Audit log (util para troubleshooting)
plugins.security.audit.type: internal_opensearch

# Performance Analyzer
plugins.performance_analyzer.enabled: true