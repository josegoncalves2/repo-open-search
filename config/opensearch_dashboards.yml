---
# ===========================================================================
# opensearch_dashboards.yml — OpenSearch Dashboards 3.8.0
# Montado em /usr/share/opensearch-dashboards/config/ via docker-compose.
#
# REGRA: só entram aqui chaves que existem no schema dos plugins desta versão.
# Uma única chave desconhecida faz o Dashboards abortar no boot
# (ValidationError: "definition for this key is missing").
# Os plugins de ML/Alerting/Anomaly/ISM/Notifications já vêm ATIVOS por padrão;
# não é preciso — nem válido — "ligá-los" via *.dashboards.enabled.
# ===========================================================================

server.host: '0.0.0.0'
server.port: 5601

opensearch.hosts: [https://opensearch:9200]
opensearch.ssl.verificationMode: none
opensearch.username: kibanaserver
opensearch.password: kibanaserver
opensearch.requestHeadersWhitelist: [authorization, securitytenant]

opensearch_security.multitenancy.enabled: true
opensearch_security.multitenancy.tenants.preferred: [Private, Global]
opensearch_security.readonly_mode.roles: [kibana_read_only]
opensearch_security.cookie.secure: false

# --------------------------------------------------------------------------
# OpenSearch Assistant — IA generativa no Dashboards
# (todas as chaves abaixo vêm `false` por padrão; requerem o root agent
#  registrado no ML Commons — feito por scripts/setup-ai.sh)
# --------------------------------------------------------------------------
assistant.chat.enabled: true                 # chat conversacional (janela do Assistant)
assistant.next.enabled: true                 # nova experiência "Assistant"
assistant.text2viz.enabled: true             # linguagem natural -> visualização
assistant.alertInsight.enabled: true         # explicação de alertas por IA
assistant.smartAnomalyDetector.enabled: true # sugestão de detectores de anomalia
assistant.incontextInsight.enabled: true     # insights contextuais (padrão já true)

# Query Assistant do Observability (texto -> PPL/consulta)
observability.query_assist.enabled: true
