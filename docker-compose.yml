services:
  opensearch:
    # Imagem propria (Dockerfile): parte do ruido de boot so sai reconstruindo -
    # Performance Analyzer sem arquivos de config, jdk.incubator.vector e
    # plugins com slf4j-api sem provider. Ver README "Logs limpos".
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION}
    image: openstack/opensearch:${OPENSEARCH_VERSION}
    container_name: opensearch-node
    # wrapper: remove Performance Analyzer, roda o instalador demo, limpa linhas
    # ruidosas do opensearch.yml e aperta permissoes antes do entrypoint oficial.
    # Ver scripts/opensearch-entrypoint.sh.
    entrypoint: ["/bin/bash", "/opensearch-entrypoint.sh"]
    environment:
      - cluster.name=${CLUSTER_NAME}
      - node.name=${NODE_NAME}
      - discovery.type=single-node
      # role 'ml' obrigatoria para deploy de modelos de IA neste no unico
      - node.roles=cluster_manager,data,ingest,remote_cluster_client,ml
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS}
      # senha de BOOTSTRAP: so inicializa o indice de seguranca no 1o start
      # (tem de passar no zxcvbn). Depois o provisioner troca admin -> senha final.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - DISABLE_SECURITY_PLUGIN=false
      # deixa o instalador demo gerar os certificados TLS + config de seguranca.
      # (por isso NAO montamos um opensearch.yml com 'plugins.security.*': isso
      #  faz o instalador pular a geracao de certs -> "No SSL configuration found")
      - DISABLE_INSTALL_DEMO_CONFIG=false
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - plugins.security.audit.type=noop
      # master key do SQL/PPL datasources (32 bytes hex) - sem isto o SQLPlugin
      # loga "Master key is a required config for using create and update datasource APIs".
      - plugins.query.datasources.encryption.masterkey=a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f901
      # ---- loggers subidos para ERROR no STARTUP (via -E; cluster settings do
      #      setup-features.sh chegam tarde demais para calar o boot) -----------
      # Cada um abaixo so emite 1 linha FYI/ruido, uma vez, no boot - e no nivel
      # ERROR ainda mostra falha real da mesma classe:
      #   security.configuration.Salt ... "configure compliance salt ..." (nao usamos field masking)
      #   security.auditlog ............. "AuditMessageRouter: No endpoint configured [...]"
      #   deprecation.security ......... 'transport_enabled'/'disabled_categories' da config demo
      #   ml.common.hooks .............. "No callbacks registered for event type ..."
      #   gateway.DanglingIndicesState . "gateway.auto_import_dangling_indices is disabled"
      #   ml...TransportPredictionStreamTaskAction / ...ExecuteStream... "StreamTransportService is not available"
      - logger.org.opensearch.security.configuration=ERROR
      - logger.org.opensearch.security.auditlog=ERROR
      - logger.org.opensearch.deprecation.security=ERROR
      - logger.org.opensearch.ml.common.hooks=ERROR
      - logger.org.opensearch.gateway.DanglingIndicesState=ERROR
      - logger.org.opensearch.ml.action.prediction.TransportPredictionStreamTaskAction=ERROR
      - logger.org.opensearch.ml.action.execute.TransportExecuteStreamTaskAction=ERROR
      # SecurityAnalyticsPlugin: "Failed to initialize LogType config index" e uma
      # corrida de boot que se resolve sozinha (os indices .opensearch-sap-* ficam
      # green segundos depois). A classe so loga ciclo de vida do plugin.
      - logger.org.opensearch.securityanalytics.SecurityAnalyticsPlugin=ERROR
      # OpenSearchSecurityPlugin: "Failed to load API tokens on node start" e uma
      # corrida do boot (a leitura acontece antes de 'state recovered') que se
      # resolve sozinha. Em ERROR, falha real da mesma classe continua aparecendo.
      - logger.org.opensearch.security.OpenSearchSecurityPlugin=ERROR
      # ---- features de IA / Agentic / LLM como node settings (via env) --------
      - plugins.ml_commons.agent_framework_enabled=true
      - plugins.ml_commons.rag_pipeline_feature_enabled=true
      - plugins.ml_commons.memory_feature_enabled=true
      - plugins.ml_commons.only_run_on_ml_node=false
      - plugins.ml_commons.allow_registering_model_via_url=true
      - plugins.ml_commons.native_memory_threshold=100
      - plugins.ml_commons.jvm_heap_memory_threshold=100
      # NAO ligar 'plugins.security.system_indices.permission.enabled'.
      # Ela parecia necessaria para gravar o root agent em .plugins-ml-config,
      # mas quebra o Dashboards: com ela ligada qualquer operacao com curinga
      # que resolva indices de sistema (ex.: GET /_list/indices, usado pelas
      # telas de Index Management / Anomaly Detection / ML Commons) responde
      # 403 "no permissions for [] and User [...]" mesmo para all_access, e a
      # pagina renderiza vazia. O provisioner grava em .plugins-ml-config com o
      # certificado admin (kirk), que dispensa a flag.
      # NOTA: nao adiantam 'password_validation_regex' nem
      # 'password_score_based_validation_strength' para permitir senha fraca -
      # o piso do score e 'fair'. A senha final e aplicada como HASH bcrypt
      # pelo provisioner (ver scripts/lib.sh).
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./scripts/opensearch-entrypoint.sh:/opensearch-entrypoint.sh:ro
      # o entrypoint copia os certos demo (kirk) para ca; o provisioner usa o
      # certificado admin para gravar em .plugins-ml-config (indice de sistema)
      - opensearch-certs:/certs
    ports:
      - "${OPENSEARCH_PORT}:9200"
      - "${OPENSEARCH_PERF_PORT}:9600"
    networks: [opensearch-net]
    deploy:
      resources:
        limits: { memory: "${OPENSEARCH_MEM_LIMIT}" }
    healthcheck:
      # 1) nao sonda antes de 60s: a camada de seguranca leva ~40-50s para
      #    inicializar e QUALQUER request nesse intervalo faz o no logar
      #    "BackendRegistry: OpenSearch Security not initialized";
      # 2) autentica com a conta reservada 'admin' - sonda anonima deixaria
      #    "No 'Authorization' header" no log.
      # O marco de partida e gravado pelo scripts/opensearch-entrypoint.sh.
      test:
        - CMD-SHELL
        - >-
          t0=$$(cat /tmp/.opensearch-start-epoch 2>/dev/null || echo 0);
          [ $$(( $$(date +%s) - $$t0 )) -ge 60 ] || exit 1;
          curl -sk -u "admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}"
          -o /dev/null -w '%{http_code}' https://localhost:9200 | grep -q 200
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 150s
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Provisiona a stack apos o OpenSearch subir:
  #   1. troca a senha do admin para a senha final (OPENSEARCH_ADMIN_PASSWORD)
  #   2. ativa todas as features oficiais (setup-features.sh)
  #   3. cria o usuario de ingestao dos agentes (setup-agent-user.sh)
  #   4. provisiona IA / Agentic / LLM: connector, modelos, root agent (setup-ai.sh)
  # Roda uma vez e sai 0. O Dashboards so inicia depois deste passo.
  # -----------------------------------------------------------------------
  provisioner:
    image: alpine:3.24
    container_name: opensearch-provisioner
    depends_on:
      opensearch: { condition: service_healthy }
    environment:
      - OS_URL=https://opensearch:9200
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - OPENSEARCH_ADMIN_USER=${OPENSEARCH_ADMIN_USER}
      - OPENSEARCH_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD}
      - AGENT_USER=${AGENT_USER}
      - AGENT_PASS=${AGENT_PASS}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_ENDPOINT=${LLM_ENDPOINT}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_API_KEY=${LLM_API_KEY}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - EMBEDDING_VERSION=${EMBEDDING_VERSION}
      - OS_CERT_DIR=/certs
    volumes:
      - ./scripts:/scripts:ro
      - opensearch-certs:/certs:ro
    command: >-
      sh -c "apk add --no-cache bash curl jq apache2-utils >/dev/null && bash /scripts/provision.sh"
    networks: [opensearch-net]
    restart: "no"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION}
    container_name: opensearch-dashboards
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      # conta de SERVICO do Dashboards: tem de ser 'kibanaserver' (role
      # kibana_server). O superuser 'pmotiadm'/all_access NAO tem a permissao
      # de /_plugins/_security/tenantinfo -> 403 no boot + "AuthorizationException".
      # O login humano no navegador continua sendo pmotiadm/pmotiadm.
      - OPENSEARCH_USERNAME=kibanaserver
      - OPENSEARCH_PASSWORD=kibanaserver
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5601
    volumes:
      - opensearch-dashboards-data:/usr/share/opensearch-dashboards/data
      - ./config/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro
    ports:
      - "${DASHBOARDS_PORT}:5601"
    networks: [opensearch-net]
    depends_on:
      opensearch:  { condition: service_healthy }
      provisioner: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { memory: "${DASHBOARDS_MEM_LIMIT}" }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf -u "$${OPENSEARCH_USERNAME}:$${OPENSEARCH_PASSWORD}"
          http://localhost:5601/api/status
          | grep -q '"state":"green"'
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Cria os saved objects do Dashboards (index patterns). Precisa ser um
  # servico separado do 'provisioner': aquele roda ANTES do Dashboards existir.
  # Sem isto os logs dos agentes chegam ao OpenSearch mas o Discover fica
  # vazio, porque nao ha index pattern para 'logs-*'.
  # -----------------------------------------------------------------------
  dashboards-init:
    image: alpine:3.24
    container_name: opensearch-dashboards-init
    depends_on:
      opensearch-dashboards: { condition: service_healthy }
    environment:
      - OSD_URL=http://opensearch-dashboards:5601
      - OSD_USER=${OPENSEARCH_ADMIN_USER}
      - OSD_PASS=${OPENSEARCH_ADMIN_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    command: >-
      sh -c "apk add --no-cache bash curl jq >/dev/null && bash /scripts/setup-dashboards.sh"
    networks: [opensearch-net]
    restart: "no"

  enroll:
    image: nginx:1.31-alpine
    container_name: opensearch-enroll
    volumes:
      - ./agent:/usr/share/nginx/html:ro
    ports:
      - "${ENROLL_PORT}:80"
    networks: [opensearch-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/install-agent.sh >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  opensearch-data:            { driver: local }
  opensearch-dashboards-data: { driver: local }
  opensearch-certs:           { driver: local }

networks:
  opensearch-net: { driver: bridge }
