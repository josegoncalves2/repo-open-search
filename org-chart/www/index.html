<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>d3-org-chart — full demo</title>
    <style>
        html, body { margin:0; padding:0; height:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:#fafafa; overflow:hidden; }
        header { padding:10px 16px; background:#1f2937; color:#fff; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        header h1 { margin:0; font-size:16px; font-weight:600; }
        header a { color:#9ca3af; font-size:12px; text-decoration:none; }
        header a:hover { color:#fff; }
        header input[type="search"] { flex:1; max-width:280px; padding:6px 10px; border-radius:6px; border:1px solid #374151; background:#111827; color:#e5e7eb; font-size:13px; outline:none; }
        header input[type="search"]::placeholder { color:#6b7280; }
        header .btns { display:flex; gap:6px; flex-wrap:wrap; }
        header .btns button { background:#374151; color:#e5e7eb; border:1px solid #4b5563; padding:5px 10px; font-size:12px; border-radius:5px; cursor:pointer; font-family:inherit; }
        header .btns button:hover { background:#4b5563; }
        header .btns button:active { background:#1f2937; }
        #chart { width:100%; min-height: calc(100vh - 60px); height: 800px; background: #fff; }
        /* Fundo cinza estilo org-chart (retangulo arredondado atras dos nos) */
        #chart svg .background-rect { fill: #f3f4f6; stroke: #e5e7eb; stroke-width: 1; rx: 10; ry: 10; }
        /* Conexoes (linhas entre nos) */
        #chart svg .link { fill: none; stroke: #cbd5e1; stroke-width: 1.5; }
        .node-card { padding:8px 12px; border-radius:8px; background:#fff; border:1px solid #d1d5db; box-shadow:0 1px 3px rgba(0,0,0,.08); font-family:inherit; min-width:140px; text-align:center; }
        .node-card .name { font-weight:600; color:#111827; font-size:13px; }
        .node-card .meta { font-size:11px; color:#6b7280; margin-top:2px; }
        .node-card.root { background:#1f2937; color:#fff; border-color:#111827; }
        .node-card.root .name { color:#fff; }
        .node-card.root .meta { color:#9ca3af; }
        .node-card:hover { box-shadow:0 4px 10px rgba(0,0,0,.12); }
        #status { position:fixed; bottom:8px; right:12px; font-size:11px; color:#374151; background:rgba(255,255,255,.92); padding:4px 8px; border-radius:4px; border:1px solid #e5e7eb; z-index:1000; }
        #err { position:fixed; bottom:8px; left:12px; max-width:60%; font-size:11px; color:#b91c1c; background:#fee2e2; padding:6px 10px; border-radius:4px; display:none; z-index:1000; }
    </style>
</head>
<body>
<header>
    <h1>d3-org-chart <a href="https://github.com/bumbeishvili/org-chart" target="_blank" rel="noopener">bumbeishvili/org-chart</a></h1>
    <input id="search" type="search" placeholder="Buscar por nome..." />
    <input id="jsonFile" type="file" accept="application/json" style="display:none" />
    <div class="btns">
        <button data-act="fit"         title="Ajustar a tela">Fit</button>
        <button data-act="expandAll"   title="Expandir tudo">Expand all</button>
        <button data-act="collapseAll" title="Recolher tudo">Collapse all</button>
        <button data-act="centerRoot"  title="Centralizar raiz">Center root</button>
        <button data-act="zoomIn"      title="Aumentar zoom">+</button>
        <button data-act="zoomOut"     title="Diminuir zoom">-</button>
        <button data-act="exportSvg"   title="Exportar SVG">SVG</button>
        <button data-act="exportPng"   title="Exportar PNG">PNG</button>
        <button data-act="exportPdf"   title="Exportar PDF">PDF</button>
        <button data-act="exportJson"  title="Exportar JSON">JSON</button>
        <button data-act="importJson"  title="Importar JSON">Import</button>
        <button data-act="clearStorage"title="Limpar localStorage">Clear</button>
        <button data-act="fullscreen"  title="Tela cheia">Full</button>
        <button data-act="reset"       title="Limpar destaque">Reset</button>
    </div>
</header>
<div id="chart"></div>
<div id="status">carregando...</div>
<div id="err"></div>

<script src="vendor/d3.v7.min.js"></script>
<script src="vendor/d3-org-chart.js"></script>
<script src="vendor/d3-flextree.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script>
(function () {
    'use strict';

    const $  = (s, c) => (c || document).querySelector(s);
    const status = (t) => { $("#status").textContent = t; };
    const showErr = (t) => { const e = $("#err"); e.textContent = t; e.style.display = t ? 'block' : 'none'; };

    const STORE_KEY = 'org-chart-data-v2';

    let chart = null;
    let rawData = [];

    function sampleData() {
        return [
            { id: 1, name: 'CEO',          parentId: null },
            { id: 2, name: 'CTO',          parentId: 1 },
            { id: 3, name: 'CFO',          parentId: 1 },
            { id: 4, name: 'COO',          parentId: 1 },
            { id: 5, name: 'Eng Manager',  parentId: 2 },
            { id: 6, name: 'Senior Eng',   parentId: 5 },
            { id: 7, name: 'Junior Eng',   parentId: 5 },
            { id: 8, name: 'DevOps',       parentId: 2 },
            { id: 9, name: 'Finance Mgr',  parentId: 3 },
            { id:10, name: 'Accountant',   parentId: 9 },
            { id:11, name: 'Operations',   parentId: 4 },
            { id:12, name: 'HR Lead',      parentId: 4 },
            { id:13, name: 'Recruiter',    parentId:12 }
        ];
    }

    function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(rawData)); } catch (_) {} }
    function loadPersisted() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (_) { return null; } }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function nodeContent(d) {
        const isRoot = !d.data.parentId;
        return '<div class="node-card ' + (isRoot ? 'root' : '') + '">'
             +   '<div class="name">' + escapeHtml(d.data.name) + '</div>'
             +   '<div class="meta">id ' + d.data.id + (isRoot ? '' : ' · pai ' + d.data.parentId) + '</div>'
             + '</div>';
    }

    async function loadData() {
        showErr('');
        const persisted = loadPersisted();
        if (persisted && Array.isArray(persisted) && persisted.length) {
            status('localStorage: ' + persisted.length + ' nos');
            return persisted;
        }
        try {
            const r = await fetch('data.csv', { cache: 'no-store' });
            if (r.ok) {
                const text = await r.text();
                const rows = d3.csvParse(text, (d) => ({
                    id:        +d.id,
                    parentId:  d.pid === '' || d.pid == null ? null : +d.pid,
                    name:      (d.name || ('Node ' + d.id)).trim()
                }));
                if (rows.length) {
                    status('data.csv: ' + rows.length + ' nos');
                    return rows;
                }
            }
        } catch (e) {
            showErr('CSV falhou: ' + e.message);
        }
        status('fallback embutido: 13 nos');
        return sampleData();
    }

    function buildChart(data) {
        rawData = data;
        chart = new d3.OrgChart()
            .container('#chart')
            .data(rawData)
            .nodeWidth(() => 180)
            .nodeHeight(() => 70)
            .childrenMargin(() => 40)
            .compactMarginBetween(() => 20)
            .compactMarginPair(() => 30)
            .neighbourMargin(() => 30)
            .siblingsMargin(() => 20)
            .buttonContent(({ node, state }) => {
                if (node.children) {
                    if (state.collapsed) return '<div style="color:#16a34a;padding:0 6px;cursor:pointer" data-collapse="' + node.data.id + '">+</div>';
                    return                    '<div style="color:#dc2626;padding:0 6px;cursor:pointer" data-expand="'   + node.data.id + '">-</div>';
                }
                return '<div style="color:#9ca3af;padding:0 6px;cursor:pointer" data-add="' + node.data.id + '">+</div>';
            })
            .nodeContent(nodeContent)
            .onNodeClick(() => {})
            .render();

        applyBackground();
        wireControls();
        wireSearch();
        wireToolbar();
        wireImport();
        status(rawData.length + ' nos');
    }

    // Fundo cinza arredondado atras dos nos (estilo classico do org-chart)
    function applyBackground() {
        const svg = document.querySelector('#chart svg');
        if (!svg) return;
        const g = svg.querySelector('g');
        if (!g) return;
        const vb = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
        const w = vb[2] || svg.getBoundingClientRect().width  || 1600;
        const h = vb[3] || svg.getBoundingClientRect().height || 1200;
        // remove background anterior se existir
        const old = svg.querySelector('rect.background-rect');
        if (old) old.remove();
        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        rect.setAttribute('class', 'background-rect');
        rect.setAttribute('x', 0);
        rect.setAttribute('y', 0);
        rect.setAttribute('width', w);
        rect.setAttribute('height', h);
        rect.setAttribute('rx', 10);
        rect.setAttribute('ry', 10);
        // insere como primeiro filho do <g> principal (atras de tudo)
        g.insertBefore(rect, g.firstChild);
    }

    function wireControls() {
        $('#chart').addEventListener('click', (ev) => {
            const t = ev.target;
            if (!t || !t.dataset) return;
            if (t.dataset.expand)        { chart.expand(t.dataset.expand).render().fit(); applyBackground(); }
            else if (t.dataset.collapse){ chart.collapse(t.dataset.collapse).render().fit(); applyBackground(); }
            else if (t.dataset.add)     { addChild(+t.dataset.add); }
        });
    }

    function addChild(parentId) {
        const newId = rawData.reduce((m, d) => Math.max(m, d.id), 0) + 1;
        rawData.push({ id: newId, name: 'Novo ' + newId, parentId: parentId });
        chart.data(rawData).render().fit();
        applyBackground();
        persist();
        status(rawData.length + ' nos (novo: ' + newId + ')');
    }

    function wireSearch() {
        const s = $('#search');
        s.addEventListener('input', () => {
            const q = s.value.toLowerCase().trim();
            if (!q) { try { chart.clearHighlighting(); } catch (_) {} chart.render(); applyBackground(); return; }
            const matches = rawData.filter(d => String(d.name || '').toLowerCase().includes(q));
            chart.setHighlighted(matches.map(d => d.id)).render();
            applyBackground();
        });
    }

    function wireToolbar() {
        document.querySelector('header .btns').addEventListener('click', (ev) => {
            const btn = ev.target.closest('button[data-act]');
            if (!btn) return;
            const act = btn.dataset.act;
            try {
                switch (act) {
                    case 'fit':         chart.fit(); applyBackground(); break;
                    case 'expandAll':   chart.expandAll().render().fit(); applyBackground(); break;
                    case 'collapseAll': {
                        const root = rawData.find(d => d.parentId == null);
                        if (root) {
                            rawData.forEach(d => { d._collapsed = false; });
                            chart.collapse(root.id).render().fit();
                            applyBackground();
                        }
                        break;
                    }
                    case 'centerRoot': {
                        const root = rawData.find(d => d.parentId == null);
                        if (root) chart.setCentered(root.id).render();
                        break;
                    }
                    case 'zoomIn':      chart.zoomIn(); break;
                    case 'zoomOut':     chart.zoomOut(); break;
                    case 'exportSvg':   downloadFromChart('svg'); break;
                    case 'exportPng':   downloadFromChart('png'); break;
                    case 'exportPdf':   downloadFromChart('pdf'); break;
                    case 'exportJson':  exportJson(); break;
                    case 'importJson':  $('#jsonFile').click(); break;
                    case 'clearStorage':localStorage.removeItem(STORE_KEY); rawData = sampleData(); chart.data(rawData).render().fit(); applyBackground(); status('localStorage limpo, ' + rawData.length + ' nos'); break;
                    case 'fullscreen':  toggleFs(); break;
                    case 'reset':       try { chart.clearHighlighting(); } catch (_) {} chart.render(); applyBackground(); break;
                }
            } catch (e) { showErr('acao ' + act + ': ' + e.message); }
        });
    }

    function toggleFs() {
        const el = document.documentElement;
        if (!document.fullscreenElement) { (el.requestFullscreen || el.webkitRequestFullscreen || (()=>{})).call(el); }
        else                              { (document.exitFullscreen   || document.webkitExitFullscreen   || (()=>{})).call(document); }
    }

    function triggerDownload(blob, name) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }

    function downloadFromChart(kind) {
        const svg = document.querySelector('#chart svg');
        if (!svg) { showErr('SVG do chart nao encontrado'); return; }
        const cloned = svg.cloneNode(true);
        if (!cloned.getAttribute('xmlns')) cloned.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        const xml = new XMLSerializer().serializeToString(cloned);
        if (kind === 'svg') { triggerDownload(new Blob([xml], { type: 'image/svg+xml' }), 'org-chart.svg'); return; }
        const vb = (cloned.getAttribute('viewBox') || '').split(/\s+/).map(Number);
        const w = vb[2] || cloned.getBoundingClientRect().width  || 1600;
        const h = vb[3] || cloned.getBoundingClientRect().height || 1200;
        const img = new Image();
        const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }));
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width  = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            if (kind === 'png') {
                canvas.toBlob(b => triggerDownload(b, 'org-chart.png'), 'image/png');
            } else if (kind === 'pdf') {
                if (!window.jspdf) { showErr('jsPDF nao carregou'); return; }
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: w > h ? 'l' : 'p', unit: 'pt', format: [w, h] });
                pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, w, h);
                pdf.save('org-chart.pdf');
            }
        };
        img.onerror = () => showErr('falha ao rasterizar SVG');
        img.src = url;
    }

    function exportJson() {
        triggerDownload(new Blob([JSON.stringify(rawData, null, 2)], { type: 'application/json' }), 'org-chart.json');
    }

    function wireImport() {
        $('#jsonFile').addEventListener('change', (ev) => {
            const f = ev.target.files && ev.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const obj = JSON.parse(r.result);
                    if (!Array.isArray(obj) || !obj.length) { showErr('JSON invalido: precisa ser array nao-vazio'); return; }
                    rawData = obj.map(d => {
                        const o = { id: +d.id, name: String(d.name || ('Node ' + d.id)) };
                        const pid = (d.parentId != null ? d.parentId : d.pid);
                        o.parentId = (pid == null || pid === '') ? null : +pid;
                        return o;
                    });
                    applyBackground();
                    persist();
                    chart.data(rawData).render().fit();
                    status('importado ' + rawData.length + ' nos');
                } catch (e) { showErr('JSON invalido: ' + e.message); }
            };
            r.readAsText(f);
        });
    }

    function boot() {
        showErr('');  // limpa qualquer erro de carregamento anterior
        if (typeof d3 === 'undefined') { showErr('d3 nao carregou'); return; }
        if (typeof d3.OrgChart === 'undefined') { showErr('d3-org-chart nao carregou'); return; }
        loadData().then(buildChart).catch(err => {
            showErr('boot falhou: ' + err.message);
            try { buildChart(sampleData()); } catch (_) {}
        });
    }

    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', boot); }
    else { boot(); }
})();
</script>
</body>
</html>
